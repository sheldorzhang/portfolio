<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
:root{--fig-w:1920px;--fig-h:1080px;--fig-bg:#FAFAFA;--ink:#1C1C1C;--ink2:#5C5C5C;--ink3:#8A8A8A;--line:#E6E6E6;
--font:"PingFang SC","Hiragino Sans GB","Noto Sans SC",sans-serif;--serif:"Noto Serif SC","Songti SC","STSong",serif}
*{box-sizing:border-box}
html,body{margin:0;background:#e8e8e8}
body{min-height:100vh;display:grid;place-items:center;font-family:var(--font);color:var(--ink)}
.canvas{width:var(--fig-w);height:var(--fig-h);padding:96px;background:var(--fig-bg);display:flex;flex-direction:column;justify-content:center}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.card{background:#fff;border:1px solid var(--ink);display:flex;flex-direction:column;min-height:760px}
.shot{height:400px;display:flex;align-items:center;justify-content:center;padding:28px;border-bottom:1px solid var(--line)}
.shot img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.txt{padding:32px 36px 36px;display:flex;flex-direction:column;gap:12px;flex:1}
.kicker{font-size:18px;color:var(--ink3);font-weight:500;letter-spacing:.02em}
h3{margin:0;font:600 34px/1.3 var(--serif)}
h3 .en{font-family:var(--font);font-size:26px;font-weight:500;color:var(--ink2);margin-left:6px}
.desc{margin:0;font-size:22px;color:var(--ink2);line-height:1.5}
.core{margin:auto 0 0;padding-top:18px;border-top:1px solid var(--line);font-size:20px;color:var(--ink3);line-height:1.6}
.core b{color:var(--ink2);font-weight:500}
</style>
</head>
<body>
<main class="canvas" aria-label="通用 AI 设计范式：Compose、Collaborate、Artifact 三类核心组件">
  <div class="grid">
    <article class="card">
      <div class="shot"><img src="../assets/c1-ch4-compose.png" alt="表达 Compose 组件界面"></div>
      <div class="txt">
        <p class="kicker">01</p>
        <h3>表达<span class="en">Compose</span></h3>
        <p class="desc">引导用户完善意图发起任务</p>
        <p class="core"><b>核心组件：</b>欢迎模块、推荐卡片、输入框、附件选择</p>
      </div>
    </article>
    <article class="card">
      <div class="shot"><img src="../assets/c1-ch4-collaborate.png" alt="协作 Collaborate 组件界面"></div>
      <div class="txt">
        <p class="kicker">02</p>
        <h3>协作<span class="en">Collaborate</span></h3>
        <p class="desc">承担理解和确认</p>
        <p class="core"><b>核心组件：</b>对话消息、agent 消息、思维链、许可面板</p>
      </div>
    </article>
    <article class="card">
      <div class="shot"><img src="../assets/c1-ch4-artifact.png" alt="产物 Artifact 组件界面"></div>
      <div class="txt">
        <p class="kicker">03</p>
        <h3>产物<span class="en">Artifact</span></h3>
        <p class="desc">把结果变成可执行的业务对象</p>
        <p class="core"><b>核心组件：</b>Canvas 画布、Generative 产物管理</p>
      </div>
    </article>
  </div>
</main>
</body>
</html>
