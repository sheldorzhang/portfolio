<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
:root{--fig-ink:#1C1C1C;--fig-ink-2:#5C5C5C;--fig-ink-3:#8A8A8A;--fig-line:#E6E6E6;--fig-bg:#FAFAFA;--fig-font:"PingFang SC","Hiragino Sans GB","Noto Sans SC",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:var(--fig-bg);font-family:var(--fig-font);color:var(--fig-ink)}
.canvas{width:1920px;height:1080px;padding:96px 120px;display:flex;align-items:center}
.table{width:100%;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1.35fr) minmax(0,1.95fr) minmax(0,1.1fr) minmax(0,1.15fr);column-gap:36px}
.head,.row{display:grid;grid-template-columns:subgrid;grid-column:1 / -1;align-items:center}
.head{padding-bottom:22px;border-bottom:1px solid var(--fig-ink);color:var(--fig-ink-3);font-size:22px;font-weight:500}
.row{min-height:240px;border-bottom:1px solid var(--fig-line);padding:26px 0}
.task small{display:block;color:var(--fig-ink-3);font-size:18px;font-weight:500;letter-spacing:.02em}
.task b{display:block;margin-top:10px;font-size:32px;font-weight:600;line-height:1.3;white-space:nowrap}
.cell{font-size:24px;line-height:1.5;color:var(--fig-ink-2)}
.thumb{flex:none;width:136px;height:88px;border:1px solid #E0E0E0;background:#fff;overflow:hidden;border-radius:6px}
.mode{display:flex;align-items:center;gap:20px;min-width:0;padding-right:28px}
.mode>div:last-child{min-width:0}
.face{width:100%;height:100%;position:relative}
.face i{display:block}
.face-in{background:#F3F4F6;padding:10px}
.face-in .ln{height:6px;background:#E4E6EA;margin-bottom:6px}
.face-in .ln.s{width:62%}
.face-in .mid{display:flex;gap:4px;margin-top:6px}
.face-in .mid i{width:34px;height:6px;background:#2C2C2C}
.face-in .mid i.g{width:14px;background:#3DDC97}
.face-in .bar{position:absolute;left:10px;right:10px;bottom:8px;height:8px;background:linear-gradient(90deg,#7AA2FF,#3D6BFF)}
.face-co{display:grid;grid-template-columns:1.15fr .85fr;height:100%;background:#F4F5F7}
.face-co .l{padding:12px 8px}
.face-co .l i{width:28px;height:6px;background:#2C2C2C;margin-bottom:6px}
.face-co .l i.s{width:48px;background:#E4E6EA}
.face-co .r{background:linear-gradient(180deg,#8EB0FF,#3D6BFF)}
.face-ag{height:100%;background:linear-gradient(160deg,#8EB4FF,#3A68F0);padding:12px 10px}
.face-ag i{height:7px;margin-bottom:6px}
.face-ag .a{width:72%;background:#F6D48A}
.face-ag .b{width:42%;background:#F3E2B0}
.face-ag .c{position:absolute;left:10px;right:16px;bottom:10px;width:auto;margin:0;background:#D9DDF8}
.mode b{display:block;font-size:28px;font-weight:600;line-height:1.3;color:var(--fig-ink);white-space:nowrap}
.mode span{display:block;margin-top:10px;font-size:22px;line-height:1.5;color:var(--fig-ink-2)}
.scene{font-size:26px;font-weight:600;color:var(--fig-ink);white-space:nowrap}
.metric{font-size:24px;line-height:1.5;color:var(--fig-ink-2)}
.head > span:nth-child(3){color:var(--fig-ink);position:relative}
.head > span:nth-child(3)::after{content:"";position:absolute;left:0;bottom:-23px;width:100%;height:4px;background:var(--fig-ink)}
</style>
</head>
<body>
<main class="canvas" aria-label="三种增长任务对应的设计介入">
  <div class="table">
    <div class="head"><span>产品目标</span><span>用户问题 / 任务条件</span><span>AI 介入方式</span><span>MAGIC 场景</span><span>关注指标</span></div>
    <div class="row">
      <div class="task"><b>01 任务激活</b><small>Activation</small></div>
      <div class="cell">跨模块任务需要人工组织与协调</div>
      <div class="mode"><div class="thumb" aria-hidden="true"><div class="face face-ag"><i class="a"></i><i class="b"></i><i class="c"></i></div></div><div><b>Multi-Agent</b><span>从目标发起，由 Agent 协作组织任务，人参与关键决策</span></div></div>
      <div class="scene">营销活动策划</div>
      <div class="metric">新建任务数、有效完成率</div>
    </div>
    <div class="row">
      <div class="task"><b>02 交付质量</b><small>Task Quality</small></div>
      <div class="cell">企业规则分散，部分约束存在歧义</div>
      <div class="mode"><div class="thumb" aria-hidden="true"><div class="face face-co"><div class="l"><i></i><i class="s"></i></div><div class="r"></div></div></div><div><b>Copilot</b><span>AI 辅助梳理规则，由人澄清与确认</span></div></div>
      <div class="scene">企业策略库配置</div>
      <div class="metric">规则准确性、结果可用性</div>
    </div>
    <div class="row">
      <div class="task"><b>03 持续活跃</b><small>Engagement</small></div>
      <div class="cell">经营机会不易发现，用户缺少任务发起线索</div>
      <div class="mode"><div class="thumb" aria-hidden="true"><div class="face face-in"><i class="ln"></i><i class="ln s"></i><div class="mid"><i></i><i class="g"></i></div><i class="bar"></i></div></div><div><b>内嵌式 AI</b><span>在工作台呈现洞察与行动建议</span></div></div>
      <div class="scene">智能首页面板</div>
      <div class="metric">活跃任务数、重复发起率</div>
    </div>
  </div>
</main>
</body>
</html>
