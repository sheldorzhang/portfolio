<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1200">
<title>工作方式对比 · Before / After</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#fff}
body{font-family:"PingFang SC","Hiragino Sans GB","Noto Sans SC",sans-serif;color:#1c1c1c}
.canvas{width:1200px;padding:28px;background:#f5f5f5}
.sec{display:flex;justify-content:space-between;align-items:baseline;font-size:17px;font-weight:600;margin:0 4px 14px}
.sec em{font-style:normal;font-size:14px;font-weight:400;color:#6b6b6b}
.card{background:#fff;border:1px solid #e6e6e6;border-radius:14px;padding:12px}
.well{background:#f2f2f2;border-radius:10px;display:flex;align-items:center;justify-content:center}
.cap{margin:12px 4px 2px;font-size:15px;color:#1c1c1c}
.divider{display:flex;align-items:center;gap:10px;margin:22px 0 18px;font-size:15px;color:#4a4a4a}
.divider::before{content:"";width:2px;height:16px;background:#cfcfcf}
/* BEFORE */
.before{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.before .well{height:112px}
.before .lbl{text-align:center;font-size:16px;margin-top:14px;padding-bottom:6px}
.ic{width:26px;height:26px;stroke:#444;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* AFTER */
.after{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.after .pane{display:flex;flex-direction:column}
.after .card{display:flex;flex-direction:column;padding:12px;flex:1}
.task{height:184px;padding:20px 18px;display:flex;flex-direction:column;justify-content:center;gap:12px}
.task .head{display:flex;align-items:center;gap:10px;font-size:16px;padding-left:10px}
.task .input{background:#fff;border-radius:8px;padding:14px 18px;font-size:16px;margin:0 8px}
.flow{height:184px;padding:18px 18px 10px}
.flow-title{display:flex;align-items:center;gap:10px;font-size:16px;margin:4px 0 0 4px}
.flow>svg{width:100%;height:auto;display:block;margin-top:14px}
.flow-title .ic{width:22px;height:22px;flex:none}
.flow-title{white-space:nowrap}
.ftext{font-size:15px;fill:#1c1c1c}
.fbox{fill:#fff;stroke:#7a7a7a;stroke-width:2}
.fline{fill:none;stroke:#7a7a7a;stroke-width:2}
</style>
</head>
<body>
<main class="canvas" aria-label="工作方式对比">
  <section>
    <div class="sec"><span>BEFORE / 功能驱动</span><em>传统 SaaS</em></div>
    <div class="before">
      <div class="card"><div class="well" style="height:112px"><svg class="ic" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c.6-3.2 3-5 6-5s5.4 1.8 6 5"/><circle cx="17" cy="9" r="2.6"/><path d="M16 14.2c2.6 0 4.4 1.5 5 4.3"/></svg></div><div class="lbl">人群圈选</div></div>
      <div class="card"><div class="well" style="height:112px"><svg class="ic" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 3h6v3H9z"/><path d="M9 11h6M9 15h4"/></svg></div><div class="lbl">活动策划</div></div>
      <div class="card"><div class="well" style="height:112px"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="3" width="6" height="6" rx="1"/><rect x="15" y="15" width="6" height="6" rx="1"/><path d="M9 6h4a2 2 0 0 1 2 2v7"/></svg></div><div class="lbl">旅程编排</div></div>
      <div class="card"><div class="well" style="height:112px"><svg class="ic" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></svg></div><div class="lbl">内容配置</div></div>
    </div>
  </section>

  <div class="divider">工作方式对比</div>

  <section>
    <div class="sec"><span>AFTER / 目标驱动</span><em>MAGIC AI</em></div>
    <div class="after">
      <div class="pane">
        <div class="card">
          <div class="well task" style="display:flex">
            <div class="head"><svg class="ic" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>任务发起工作台</div>
            <div class="input">策划一场沉默会员召回活动</div>
          </div>
        </div>
        <div class="cap">01 从营销目标发起任务</div>
      </div>
      <div class="pane">
        <div class="card">
          <div class="well flow" style="display:block">
            <div class="flow-title"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><path d="M10 6.5h4v11h-4"/></svg>Agent 产物 / MA 画布</div>
            <svg viewBox="0 0 480 150" aria-hidden="true">
              <rect class="fbox" x="8" y="55" width="92" height="46" rx="8"/><text class="ftext" x="54" y="84" text-anchor="middle">人群</text>
              <path class="fline" d="M100 78H130M130 40V116"/>
              <path class="fline" d="M130 40H168M130 116H168"/>
              <rect class="fbox" x="168" y="18" width="98" height="44" rx="8"/><text class="ftext" x="217" y="46" text-anchor="middle">触达 A</text>
              <rect class="fbox" x="168" y="88" width="98" height="44" rx="8"/><text class="ftext" x="217" y="116" text-anchor="middle">触达 B</text>
              <path class="fline" d="M266 40H306V110H266M306 75H330"/>
              <rect class="fbox" x="330" y="55" width="92" height="46" rx="8"/><text class="ftext" x="376" y="84" text-anchor="middle">后续</text>
            </svg>
          </div>
        </div>
        <div class="cap">02 核对与应用业务产物</div>
      </div>
    </div>
  </section>
</main>
</body>
</html>
