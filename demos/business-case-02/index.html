  /* Effect tokens — local Figma Effect styles: Foundations/_figma_use_figma_import_effects_code.js → names effects/<token-suffix> (qd-paint-* not exported as effects). */

  --qd-effect-qd-area-shadow: 0px 0px 4px rgb(0 0 0 / 0.05), 0px 2px 24px rgb(41 62 182 / 0.03), 0px 4px 32px rgb(41 62 182 / 0.02);
  --qd-effect-qd-box-shadow: 0px 8px 20px rgb(0 0 0 / 0.08), 0px 12px 32px rgb(0 0 0 / 0.04);
  --qd-effect-qd-box-shadow-messagebox: 0px 3px 6px rgb(0 0 0 / 0.12), 0px 6px 16px rgb(0 0 0 / 0.08), 0px 9px 28px rgb(0 0 0 / 0.05);
  --qd-effect-qd-box-shadow-dark: 0px 8px 16px rgb(0 0 0 / 0.16), 0px 12px 32px rgb(0 0 0 / 0.12), 0px 16px 48px rgb(0 0 0 / 0.24);
  --qd-effect-qd-box-shadow-left: -1px 0 1px -1px rgb(18 19 25 / 0.08), -4px 0 4px -4px rgb(18 19 25 / 0.08), -12px 0 12px -12px rgb(18 19 25 / 0.12);
  --qd-effect-qd-box-shadow-light: 0px 12px 48px rgb(0 0 0 / 0.03), 0px 9px 28px rgb(0 0 0 / 0.05), 0px 6px 16px rgb(0 0 0 / 0.08);
  --qd-effect-qd-box-shadow-lighter: 0px 6px 16px rgb(0 0 0 / 0.08), 0px 9px 28px rgb(0 0 0 / 0.05), 0px 12px 28px rgb(0 0 0 / 0.03);
  --qd-effect-qd-box-shadow-right: 1px 0 1px -1px rgb(18 19 25 / 0.08), 4px 0 4px -4px rgb(18 19 25 / 0.08), 12px 0 12px -12px rgb(18 19 25 / 0.12);
  --qd-effect-qd-card-shadow: 0px 12px 20px rgb(0 0 0 / 0.02), 0px 8px 12px rgb(0 0 0 / 0.03), 0px 2px 4px rgb(0 0 0 / 0.03);
  --qd-effect-qd-card-shadow-drawer: -12px 0px 20px rgb(0 0 0 / 0.02), -8px 0px 12px rgb(0 0 0 / 0.03), -2px 0px 4px rgb(0 0 0 / 0.03);
  --qd-effect-qd-card-shadow-light: 0px 0px 1px rgb(0 0 0 / 0.04), 0px 2px 4px rgb(0 0 0 / 0.04); /* layer 顺序按 Figma：1px(顶层) → 4px(底层)，与用户校验稿 24654:285 完全一致 */
  --qd-effect-qd-node-shadow: 0px 2px 8px rgb(0 0 0 / 0.03), 0px 2px 6px rgb(0 0 0 / 0.04), 0px 0px 2px rgb(0 0 0 / 0.05);
  --qd-effect-qd-node-shadow-dark: 0px 6px 12px rgb(0 0 0 / 0.04), 0px 3px 6px rgb(0 0 0 / 0.04), 0px 0px 2px rgb(0 0 0 / 0.06);

  /* Local paint style mapped as token */
  --qd-paint-qd-bg-gradient: transparent;

  /* Component tokens — fixed-column shadow (table)
     与 qd-element-plus 生产同名同值；用 inset + 负 spread 在 10px 宽外置
     pseudo 上画渐变条。规避 outer box-shadow 在 sticky + table-cell 下被
     栅格化吃掉的兼容问题。配套规则见 qd-components.css 的
     `.qd-table-wrap--fixed-col`。 */
  --qd-table-fixed-left-column:  inset  10px 0 10px -10px rgb(0 0 0 / 0.15);
  --qd-table-fixed-right-column: inset -10px 0 10px -10px rgb(0 0 0 / 0.15);

  /* 弹窗 / 全局蒙层背景模糊（配合 --qd-bg-color-mask） */

     SideNavItem 组件集 24774:12｜level × state = L1/L2 × normal/hover/active
      ｜normal: 透明
      ｜hover : --qd-color-grey-2 (= --qd-fill-color｜#ECEFF3)
      ｜active: --qd-fill-color-extra-light (#F7F8FA)
     扩展能力（Figma 未直接建模，仓库实现）：
      ｜L1 expandable → 展开/收起 L2 子列表（max-height transition 250ms）
      ｜整体可收起为 icon-only 模式（.qd-app-sidebar.is-collapsed｜208 → 56｜width transition 250ms）
     待 token 化（已记入 component-gap-log.md）：
      ｜208w / 56w（壳层展开/收起宽，无 layout-tokens 变量）
      ｜L1 顶下 9px padding（无 9 spacing token，组件内字面值）
      ｜L2 左 44px padding（icon 列右沿对齐复合值） */
  #productMount[data-theme="light"] .qd-app-sidebar{

  /* 整体收起：icon-only｜仅显示 L1 头部 icon */

  }
  /* 滚动区｜组间 4px gap（--spacing-tight） */
  #productMount[data-theme="light"] .qd-app-sidebar__scroll{
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    gap: var(--qd-spacing-tight);
  }
  /* 底部 footer｜含收起/展开 toggle｜无分割线（按设计稿 24702:421） */
  #productMount[data-theme="light"] .qd-app-sidebar__footer{
    flex-shrink: 0;
    padding: var(--qd-spacing-base) 0;
    display: flex;
    justify-content: flex-start;
  }
  /* footer toggle 内的双 icon｜默认显示 fold（"折叠"语义）；is-collapsed 切换为 expand */
  #productMount[data-theme="light"] .qd-app-sidebar__footer .qd-sidebar-expand-icon{ display: none; }
  #productMount[data-theme="light"] .qd-app-sidebar.is-collapsed .qd-app-sidebar__footer .qd-sidebar-fold-icon{ display: none; }
  #productMount[data-theme="light"] .qd-app-sidebar.is-collapsed .qd-app-sidebar__footer .qd-sidebar-expand-icon{ display: inline-block; }
  /* SideNavGroup｜L1 header + 可选 L2 列表（accordion） */
  #productMount[data-theme="light"] .qd-side-nav-group{
    display: flex;
    flex-direction: column;
    gap: var(--qd-spacing-tight); /* 4 */
  }
  /* L2 列表容器｜max-height 过渡，承载展开/收起动效 */
  #productMount[data-theme="light"] .qd-side-nav-group__items{
    display: flex;
    flex-direction: column;
    gap: var(--qd-spacing-tight);

  #productMount[data-theme="light"] .qd-side-nav-group.is-collapsed .qd-side-nav-group__items{

    align-items: center;

    line-height: 22px;
    text-decoration: none;

  /* hover｜三态之一（Figma 24774:22 / 24774:53） */
  #productMount[data-theme="light"] .qd-side-nav-item:not(.is-disabled):not([disabled]):hover{

  #productMount[data-theme="light"] .qd-side-nav-item--l2{

  #productMount[data-theme="light"] .qd-side-nav-item__main{

  #productMount[data-theme="light"] .qd-side-nav-group:not(.is-collapsed) .qd-side-nav-item__arrow{

/* === Showcase2 product-mount FINAL LAYOUT (v1.6.10c) === */
/* Tokens: design-typography (body1 14/22 w400|w500; body3 12/20);
   design-layout spacing/radius; design-colors text-primary/secondary/yellow-6.
   Case1: pl-product__name w500; pl-muted secondary; pl-fav only color (no card chrome). */
#productMount[data-theme="light"] {
  color: var(--qd-text-color-primary, #242633);
  background: var(--qd-bg-color-page, #fff);
  border-radius: var(--qd-radius-special, 12px);
  overflow: visible;
  min-height: 450px;
  font-size: 14px;
  line-height: 22px;
  font-weight: 400;
  text-align: left;
  box-sizing: border-box;
}
#productMount[data-theme="light"] *,
#productMount[data-theme="light"] *::before,
#productMount[data-theme="light"] *::after { box-sizing: border-box; }
#productMount[data-theme="light"] .product {
  background: transparent; color: inherit; border-radius: 0; min-height: 0; overflow: visible;
}

/* ----- Shared filter toolbar (basic tokens; not Case1 page__filter-grid clone) ----- */
#productMount[data-theme="light"] .s2-toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: var(--qd-spacing-loose, 16px);
  padding: var(--qd-spacing-loose, 16px) var(--qd-spacing-extra-loose, 24px) var(--qd-spacing-base-loose, 12px);

  min-width: 0;
}
#productMount[data-theme="light"] .s2-field {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: var(--qd-spacing-tight, 4px);
  flex: 1 1 160px;
  min-width: 148px;
  max-width: 220px;
  margin: 0;
}
#productMount[data-theme="light"] .s2-field__label {
  font-size: 12px;
  line-height: 20px;
  font-weight: 400;
  color: var(--qd-text-color-secondary, #7c7e89);
}
#productMount[data-theme="light"] .s2-field__control,
#productMount[data-theme="light"] .s2-field__control .qd-input {
  width: 100%;
  min-width: 0;
  display: block;
}
#productMount[data-theme="light"] .s2-actions {
  display: flex;
  flex-wrap: wrap;
  gap: var(--qd-spacing-base, 8px);
  align-items: center;
  flex: 0 0 auto;
  padding-bottom: 1px;
}
#productMount[data-theme="light"] .s2-batch {
  display: flex;
  flex-wrap: wrap;
  gap: var(--qd-spacing-base, 8px) var(--qd-spacing-base-loose, 12px);
  align-items: center;
  padding: var(--qd-spacing-base-loose, 12px) var(--qd-spacing-extra-loose, 24px);
  color: var(--qd-text-color-secondary, #7c7e89);
  font-size: 12px;
  line-height: 20px;
}
#productMount[data-theme="light"] select.qd-input__inner {
  appearance: auto;
  width: 100%;
  height: 32px;
  border: 1px solid var(--qd-border-color);
  border-radius: var(--qd-radius-base, 4px);
  padding: 0 8px;
  background: var(--qd-fill-color-blank, #fff);
  color: var(--qd-text-color-primary);
  font: inherit;
}

/* ----- Favorite vs batch-select (verified class triggers) -----
   Batch select border: .pcard.selected / .pcard.is-selected / .pl-card.is-selected (checkbox only in JS).
   Favorite: .pl-fav.is-active → yellow solid star ONLY; no card border, no SPU weight change. */
#productMount[data-theme="light"] .pl-fav,
#productMount[data-theme="light"] .pl-fav:hover,
#productMount[data-theme="light"] .pl-fav:focus,
#productMount[data-theme="light"] .pl-fav:active {
  background: transparent !important;
  border: 0 !important;
  box-shadow: none !important;
  color: var(--qd-text-color-placeholder, #a0a3af);
}
#productMount[data-theme="light"] .pl-fav.is-active {
  color: var(--qd-yellow-6, var(--qd-color-warning, #f5c044)) !important;
  background: transparent !important;
  border: 0 !important;
  box-shadow: none !important;
}
#productMount[data-theme="light"] .pl-fav svg {
  width: 16px !important; height: 16px !important;
  max-width: 16px !important; max-height: 16px !important;
}
/* Do NOT style favorite onto card chrome */
#productMount[data-theme="light"] .pcard:has(.pl-fav.is-active):not(.selected):not(.is-selected) {
  border-color: var(--qd-border-color, #e8e8ee);
  box-shadow: var(--qd-effect-qd-card-shadow-light, 0 0 1px rgb(0 0 0 / 0.04), 0 2px 4px rgb(0 0 0 / 0.04));
}
#productMount[data-theme="light"] .pcard.selected,
#productMount[data-theme="light"] .pcard.is-selected {
  border-color: var(--qd-color-primary, #9d80ed);
}

/* ----- Type hierarchy ----- */
#productMount[data-theme="light"] .s2-name,
#productMount[data-theme="light"] .pl-product__name,
#productMount[data-theme="light"] .pcard .qd-card__body h4,
#productMount[data-theme="light"] .pcard .cardbody h4 {
  margin: 0;
  font-size: 14px;
  line-height: 22px;
  font-weight: 500; /* qd-text-bold-body1-bold */
  color: var(--qd-text-color-primary, #242633);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
/* SPU: secondary, regular weight — neutralize Case1 pl-code chip look */
#productMount[data-theme="light"] .pl-code,
#productMount[data-theme="light"] .pl-muted,

  margin-top: var(--qd-spacing-tight, 4px);

  margin-top: var(--qd-spacing-base, 8px);
}
#productMount[data-theme="light"] .pcard .qd-card__body {
  padding: var(--qd-spacing-base, 8px) var(--qd-spacing-base-loose, 12px) var(--qd-spacing-base-loose, 12px);
}

/* checkbox icon sizes */
#productMount[data-theme="light"] .qd-checkbox {
  display: inline-flex; align-items: center; justify-content: center;
  width: 16px; height: 16px; vertical-align: middle;
}
#productMount[data-theme="light"] .qd-checkbox__box {
  width: 16px !important; height: 16px !important;
  min-width: 16px; min-height: 16px; overflow: hidden;
}
#productMount[data-theme="light"] .qd-checkbox__icon,#productMount[data-theme="light"] .qd-checkbox__box > svg.qd-checkbox__icon {  position: absolute; left: 0; top: 0;  width: 16px !important; height: 16px !important;  max-width: 16px !important; max-height: 16px !important;  display: none; pointer-events: none; color: var(--qd-text-color-white, #fff);}#productMount[data-theme="light"] .qd-checkbox__box > svg.qd-checkbox__icon use,#productMount[data-theme="light"] .qd-checkbox__icon use {  /* keep sprite glyph */}
#productMount[data-theme="light"] .cardimage .qd-checkbox {
  position: absolute; top: 8px; left: 8px; z-index: 1;
}
#productMount[data-theme="light"] .cardimage .pl-fav {
  position: absolute; top: 4px; right: 4px; z-index: 1;

/*
  B columns by CONTENT width (auto-fill), not viewport media.
  Root cause of prior "wrote 4 still saw 5": @container min-width:1000px could fire when
  #productMount inline size ≥1000, and nested @supports/@container was fragile.
  auto-fill minmax(210px,1fr): ~902px content @1280+rail => 4; only when track fits 5×210.

#productMount[data-theme="light"] .cards {
  display: grid !important;
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)) !important;
  gap: var(--qd-spacing-base-loose, 12px);

  max-height: 620px;

  align-content: start;

  margin: 0; overflow: hidden; min-width: 0;
  border: 1px solid var(--qd-border-color, #e8e8ee);
  border-radius: var(--qd-radius-base, 4px);
  background: var(--qd-fill-color-blank, #fff);
  box-shadow: var(--qd-effect-qd-card-shadow-light, 0 0 1px rgb(0 0 0 / 0.04), 0 2px 4px rgb(0 0 0 / 0.04));

  border-left: 0;
  border-right: 0;
}
#productMount[data-theme="light"] .s2-hifi-action + .s2-hifi-action::before {
  content: "";
  position: absolute;
  left: 0;
  top: 50%;
  transform: translateY(-50%);
  width: 1px;
  height: 16px;
  background: var(--qd-border-color, #ececf1); /* TMC separator / border token */
  pointer-events: none;
}
#productMount[data-theme="light"] .s2-hifi-action:hover { background: var(--qd-fill-color-light, #f7f7f9); color: var(--qd-text-color-primary, #242633); }
#productMount[data-theme="light"] .s2-hifi-action__icon {
  display: inline-flex; width: 20px; height: 20px; align-items: center; justify-content: center;
  background: transparent !important; border: 0 !important; box-shadow: none !important;
}
#productMount[data-theme="light"] .s2-hifi-action__icon svg { width: 16px; height: 16px; display: block; }
#productMount[data-theme="light"] .s2-hifi-action--fav.is-active {
  color: var(--qd-yellow-6, #f5a623);
}
#productMount[data-theme="light"] .s2-hifi-action--fav.is-active .s2-hifi-action__icon svg {
  color: var(--qd-yellow-6, #f5a623); fill: var(--qd-yellow-6, #f5a623);
}
#productMount[data-theme="light"] .s2-hifi-action--danger { color: var(--qd-text-color-secondary, #7c7e89); }
#productMount[data-theme="light"] .s2-hifi-action--danger:hover { color: var(--qd-red-6, #e34d59); }
#productMount[data-theme="light"] .s2-meta--sub {
  font-size: 12px; line-height: 20px; color: var(--qd-text-color-secondary, #7c7e89);
}



/* === v1.6.12 t551 (action row rules folded into v1.6.14) === */
#productMount[data-theme="light"] .s2-hifi-action__label {
  font-size: 12px; line-height: 20px; white-space: nowrap;
}
#productMount[data-theme="light"] .s2-hifi-card,
#productMount[data-theme="light"] .s2-compare-card--after {
  transition: box-shadow .15s ease, border-color .15s ease;
  border: 1px solid var(--qd-border-color, #ececf1);
  box-shadow: none;
}
/* hover: neutral elevation only when not selected — avoid colored double ring */
#productMount[data-theme="light"] .s2-hifi-card:hover:not(.is-selected):not(.selected),
#productMount[data-theme="light"] .s2-compare-card--after:hover:not(.is-selected):not(.selected) {
  box-shadow: var(--qd-effect-qd-card-shadow, 0px 12px 20px rgb(0 0 0 / 0.02), 0px 8px 12px rgb(0 0 0 / 0.03), 0px 2px 4px rgb(0 0 0 / 0.04));
}
/* selected: single theme border only (was border + 0 0 0 1px primary = double line) */
#productMount[data-theme="light"] .s2-hifi-card.is-selected,
#productMount[data-theme="light"] .s2-hifi-card.selected,
#productMount[data-theme="light"] .s2-compare-card--after.is-selected,
#productMount[data-theme="light"] .s2-compare-card--after.selected {
  border-color: var(--qd-color-primary, #5555ec);
  box-shadow: none;
  outline: none;
}
/* t580: drop card-level focus-within/focus-visible ring (shows after uncheck while focus remains).
   Selected keeps single theme border; hover keeps neutral shadow. Other controls keep their own focus. */
#productMount[data-theme="light"] .s2-hifi-card:focus,
#productMount[data-theme="light"] .s2-hifi-card:focus-visible,
#productMount[data-theme="light"] .s2-hifi-card:focus-within,
#productMount[data-theme="light"] .s2-compare-card--after:focus,
#productMount[data-theme="light"] .s2-compare-card--after:focus-visible,
#productMount[data-theme="light"] .s2-compare-card--after:focus-within {
  outline: none;
  box-shadow: none;
}
#productMount[data-theme="light"] .s2-hifi-card.is-selected:focus-within,
#productMount[data-theme="light"] .s2-hifi-card.selected:focus-within,
#productMount[data-theme="light"] .s2-compare-card--after.is-selected:focus-within,
#productMount[data-theme="light"] .s2-compare-card--after.selected:focus-within {
  border-color: var(--qd-color-primary, #5555ec);
  outline: none;
  box-shadow: none;
}
#productMount[data-theme="light"] .s2-card-compare {
  padding: 8px 4px 16px;
}
#productMount[data-theme="light"] .s2-card-compare__note {
  margin: 0 0 16px;
  font-size: 12px; line-height: 20px;
  color: var(--qd-text-color-secondary, #7c7e89);
}
#productMount[data-theme="light"] .s2-card-compare__grid {
  /* superseded by v1.6.15a compact centered group below */
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 28px;
  width: 100%;
}

#productMount[data-theme="light"] .s2-compare-card--before.is-selected,
#productMount[data-theme="light"] .s2-compare-card--before.selected {
  border-color: var(--qd-border-color, #ececf1);
  box-shadow: none;
}
@media (max-width: 900px) {
  #productMount[data-theme="light"] .s2-card-compare__grid {
    grid-template-columns: minmax(0, 1fr);
  }
}
#productMount[data-theme="light"] .s2-card-compare__label {
  margin: 0 0 10px;
  font-size: 13px; line-height: 20px; font-weight: 500;
  color: var(--qd-text-color-secondary, #7c7e89);
}
#productMount[data-theme="light"] .s2-compare-card {
  width: 100%;
  max-width: 360px;
  height: auto !important;
  align-self: start;
}
#productMount[data-theme="light"] .s2-compare-card--before .cardimage {
  aspect-ratio: 1 / 1;
}
#productMount[data-theme="light"] .s2-cards-hifi {
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)) !important;
}



/* === v1.6.14 t553: TMC2.0 qd-checkbox centering on hifi cards (card+page) === */
#productMount[data-theme="light"] .s2-hifi-media > .qd-checkbox,
#productMount[data-theme="light"] .s2-cards-hifi .s2-hifi-media > .qd-checkbox,
#productMount[data-theme="light"] .s2-compare-card--after .s2-hifi-media > .qd-checkbox {
  position: absolute;
  top: 8px;
  left: 8px;
  z-index: 2;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 16px;
  height: 16px;
  margin: 0;
  padding: 0;
  gap: 0;
  line-height: 0;
  vertical-align: top;
}
#productMount[data-theme="light"] .s2-hifi-media > .qd-checkbox input,
#productMount[data-theme="light"] .s2-cards-hifi .s2-hifi-media > .qd-checkbox input,
#productMount[data-theme="light"] .s2-compare-card--after .s2-hifi-media > .qd-checkbox input {
  position: absolute;
  opacity: 0;
  width: 0;
  height: 0;
  margin: 0;
  inset: 0;
}
#productMount[data-theme="light"] .s2-hifi-media .qd-checkbox__box,
#productMount[data-theme="light"] .s2-cards-hifi .qd-checkbox__box,
#productMount[data-theme="light"] .s2-compare-card--after .qd-checkbox__box {
  position: relative;
  box-sizing: border-box;
  width: 16px !important;
  height: 16px !important;
  min-width: 16px !important;
  min-height: 16px !important;
  margin: 0 !important;
  flex-shrink: 0;
  overflow: hidden;
  border-radius: var(--qd-radius-small, 2px);
  background: var(--qd-fill-color-blank, #fff);
  border: 1px solid var(--qd-border-color-dark, #c9c9d1);
}
#productMount[data-theme="light"] .s2-hifi-media .qd-checkbox input:checked:enabled + .qd-checkbox__box,
#productMount[data-theme="light"] .s2-cards-hifi .qd-checkbox input:checked:enabled + .qd-checkbox__box,
#productMount[data-theme="light"] .s2-compare-card--after .qd-checkbox input:checked:enabled + .qd-checkbox__box {
  background: var(--qd-color-primary, #5555ec);
  border-color: var(--qd-color-primary, #5555ec);
  border-width: 0;
}
#productMount[data-theme="light"] .s2-hifi-media .qd-checkbox__icon,
#productMount[data-theme="light"] .s2-cards-hifi .qd-checkbox__icon,
#productMount[data-theme="light"] .s2-compare-card--after .qd-checkbox__icon {
  position: absolute;
  left: 0;
  top: 0;
  width: 16px !important;
  height: 16px !important;
  max-width: 16px !important;
  max-height: 16px !important;
  margin: 0;
  pointer-events: none;
  color: var(--qd-text-color-white, #fff);
}
#productMount[data-theme="light"] .s2-hifi-media .qd-checkbox input:checked:enabled + .qd-checkbox__box .qd-checkbox__icon--check,
#productMount[data-theme="light"] .s2-cards-hifi .qd-checkbox input:checked:enabled + .qd-checkbox__box .qd-checkbox__icon--check,
#productMount[data-theme="light"] .s2-compare-card--after .qd-checkbox input:checked:enabled + .qd-checkbox__box .qd-checkbox__icon--check {
  display: block !important;
}
#productMount[data-theme="light"] .s2-hifi-media .qd-checkbox input:checked + .qd-checkbox__box .qd-checkbox__icon--semi,
#productMount[data-theme="light"] .s2-cards-hifi .qd-checkbox input:checked + .qd-checkbox__box .qd-checkbox__icon--semi,
#productMount[data-theme="light"] .s2-compare-card--after .qd-checkbox input:checked + .qd-checkbox__box .qd-checkbox__icon--semi {
  display: none !important;
}
/* keep selected card border theme (t551) — qd primary, not shell purple */
/* duplicate selected rule removed t558 */



/* === v1.6.15a t562: compact centered compare group (fix item 6 stage whitespace) === */
/* Group max = 340 + 28 + 340 = 708; leftover width sits on sides, not between cards. */
#productMount[data-theme="light"] .s2-card-compare {
  padding: 12px 16px 20px;
  width: 100%;
  box-sizing: border-box;
}
/* t593: original-size cards; normal-flow side notes start at each card body top. */
#productMount[data-theme="light"] .s2-card-compare__layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 28px;
  justify-content: center;
  max-width: 1096px;
  margin-inline: auto;
  align-items: start;
  width: 100%;
  box-sizing: border-box;
}
#productMount[data-theme="light"] .s2-card-compare__group {
  display: grid;
  align-items: start;
  column-gap: 18px;
  min-width: 0;
  width: 100%;
}
#productMount[data-theme="light"] .s2-card-compare__group--before {
  grid-template-columns: minmax(132px, 176px) minmax(0, 340px);
  justify-content: end;
}
#productMount[data-theme="light"] .s2-card-compare__group--after {
  grid-template-columns: minmax(0, 340px) minmax(132px, 176px);
  justify-content: start;
}
#productMount[data-theme="light"] .s2-card-compare__aside {
  min-width: 0;
  display: grid;
  gap: 12px;
  align-content: start;
  padding-top: 30px; /* aligns first note with card border, below its label */
  box-sizing: border-box;
}
#productMount[data-theme="light"] .s2-card-compare__anno {
  margin: 0;
  padding: 8px 10px;
  border: 1px solid var(--qd-border-color, #ececf1);
  border-radius: 8px;
  background: var(--qd-fill-color-light-1, #f7f7fa);
  box-sizing: border-box;
  display: grid;
  grid-template-columns: 18px minmax(0, 1fr);
  gap: 8px;
  align-items: start;
}
#productMount[data-theme="light"] .s2-card-compare__num {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  font-size: 11px;
  line-height: 1;
  font-weight: 600;
  color: var(--qd-text-color-secondary, #7c7e89);
  border: 1px solid var(--qd-border-color, #ececf1);
  background: #fff;
  box-sizing: border-box;
}
#productMount[data-theme="light"] .s2-card-compare__anno-body { min-width: 0; }
#productMount[data-theme="light"] .s2-card-compare__anno-topic {
  margin: 0 0 4px;
  font-size: 12px;
  line-height: 18px;
  font-weight: 600;
  color: var(--qd-text-color-primary, #2e2f33);
}
#productMount[data-theme="light"] .s2-card-compare__anno-text {
  margin: 0;
  font-size: 12px;
  line-height: 18px;
  color: var(--qd-text-color-regular, #4b4d55);
  overflow-wrap: anywhere;
}
#productMount[data-theme="light"] .s2-card-compare__anno-point + .s2-card-compare__anno-point { margin-top: 6px; }
#productMount[data-theme="light"] .s2-card-compare__col {
  display: flex;
  flex-direction: column;
  min-width: 0;
  align-items: stretch;
  width: 100%;
  max-width: 340px;
  overflow: visible;
}
#productMount[data-theme="light"] .s2-compare-wrap {
  position: relative;
  width: 100%;
  min-width: 0;
  overflow: visible;
}
#productMount[data-theme="light"] .s2-compare-stage {
  width: 100%;
  max-width: none; /* column already capped by group max-width */
  min-width: 0;
  display: block; /* natural height — do not stretch to sibling */
  flex: 0 0 auto;
}
#productMount[data-theme="light"] .s2-compare-stage > .s2-compare-card {
  width: 100%;
  max-width: none;
  display: flex;
  flex-direction: column;
  flex: 0 0 auto;
  min-height: 0;
  height: auto;
  align-self: stretch;
}
/* before/after bodies: content stack only — no flex-grow fake height */
#productMount[data-theme="light"] .s2-compare-card--before .cardbody {
  display: flex;
  flex-direction: column;
  flex: 0 0 auto;
}
#productMount[data-theme="light"] .s2-compare-card--before .s2-row-actions,
#productMount[data-theme="light"] .s2-compare-card--after .s2-hifi-actions {
  margin-top: 0; /* no bottom-pin against stretched sibling */
}
#productMount[data-theme="light"] .s2-compare-card--before {
  /* read-only preview: no selected chrome; structure/content untouched */
  border-color: var(--qd-border-color, #ececf1);
  box-shadow: none;
}
#productMount[data-theme="light"] .s2-compare-card--before.is-selected,
#productMount[data-theme="light"] .s2-compare-card--before.selected {
  border-color: var(--qd-border-color, #ececf1);
  box-shadow: none;
}
#productMount[data-theme="light"] .s2-hifi-action {
  appearance: none;
  border: 0;
  background: transparent;
  cursor: pointer;
  display: inline-flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 40px;
  padding: 12px 6px;
  font-size: 12px;
  line-height: 20px;
  color: var(--qd-text-color-secondary, #7c7e89);
  border-radius: 0;
  box-shadow: none;
}
#productMount[data-theme="light"] .s2-hifi-action__icon {
  display: inline-flex;
  width: 16px;
  height: 16px;
  flex: 0 0 auto;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 0;
  box-shadow: none;
}
#productMount[data-theme="light"] .s2-hifi-action__label {
  flex: 0 0 auto;
}
@media (max-width: 980px) {
  /* narrow: one card-group per row — keep outer notes + card relation; no text squeeze */
  #productMount[data-theme="light"] .s2-card-compare__layout {
    grid-template-columns: minmax(0, 1fr);
    gap: 28px;
  }
  #productMount[data-theme="light"] .s2-card-compare__group--before,
  #productMount[data-theme="light"] .s2-card-compare__group--after {
    justify-content: center;
  }
}
@media (max-width: 720px) {
  /* Very narrow: normal-flow notes stack with each corresponding card. */
  #productMount[data-theme="light"] .s2-card-compare__group--before,
  #productMount[data-theme="light"] .s2-card-compare__group--after {
    grid-template-columns: minmax(0, 1fr);
    justify-items: center;
  }
  #productMount[data-theme="light"] .s2-card-compare__aside {
    padding-top: 0;
    width: 100%;
    max-width: 340px;
  }
  #productMount[data-theme="light"] .s2-card-compare__group--before .s2-card-compare__aside { order: -1; }
}

function s2SelectCurrent(id){
  if(id==='category')return state.category||'';

function s2QdSelect(id,ariaLabel){
  const opts=s2SelectOptions(id);
  const cur=s2SelectCurrent(id);
  const curOpt=opts.find(o=>o.value===cur)||opts[0];
  const nativeOpts=opts.map(o=>`<option value="${esc(o.value)}" ${o.value===cur?'selected':''}>${esc(o.label)}</option>`).join('');
  const items=opts.map((o,i)=>`<div role="option" class="qd-select-dropdown__item${o.value===cur?' is-selected':''}" data-s2-option="${esc(o.value)}" id="${id}-opt-${i}" aria-selected="${o.value===cur?'true':'false'}">${esc(o.label)}</div>`).join('');
  return `<div class="s2-field" data-s2-field="${id}">
<span class="s2-field__label">${esc(ariaLabel)}</span>
<span class="s2-field__control">
<select id="${id}" class="s2-native-select" tabindex="-1" aria-hidden="true">${nativeOpts}</select>
<div class="qd-select qd-select--interactive" data-s2-select="${id}" data-qd-value="${esc(curOpt.label)}" role="combobox" tabindex="0" aria-haspopup="listbox" aria-expanded="false" aria-label="${esc(ariaLabel)}" aria-controls="${id}-options">
<div class="qd-select__trigger"><span class="qd-select__value">${esc(curOpt.label)}</span></div>
<span aria-hidden="true" class="qd-select__arrow"><svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><use href="#ds-icon-arrow-down"></use></svg></span>
<div class="qd-select-dropdown" id="${id}-options" role="listbox" aria-label="${esc(ariaLabel)}" hidden>${items}</div>
</div>
</span>
</div>`;
}
function s2CloseSelect(root){
  if(!root)return;
  root.classList.remove('is-open');
  root.setAttribute('aria-expanded','false');
  root.removeAttribute('aria-activedescendant');
  const list=root.querySelector('.qd-select-dropdown');
  if(list)list.hidden=true;
  root.querySelectorAll('[role="option"]').forEach(o=>o.classList.remove('is-highlighted'));
}
function s2CloseAllSelects(except){
  document.querySelectorAll('#productMount .qd-select--interactive.is-open').forEach(r=>{if(r!==except)s2CloseSelect(r);});
}
function s2OpenSelect(root){
  if(!root||!document.getElementById('productMount')?.contains(root))return;
  s2CloseAllSelects(root);
  const list=root.querySelector('.qd-select-dropdown');
  const options=Array.from(root.querySelectorAll('[role="option"]'));
  let selected=options.findIndex(o=>o.getAttribute('aria-selected')==='true');
  if(selected<0)selected=0;
  root._s2Active=selected;
  if(list)list.hidden=false;
  root.classList.add('is-open');
  root.setAttribute('aria-expanded','true');
  options.forEach((o,i)=>o.classList.toggle('is-highlighted',i===selected));
  if(options[selected])root.setAttribute('aria-activedescendant',options[selected].id);
}
function s2ChooseSelect(root,index){
  const options=Array.from(root.querySelectorAll('[role="option"]'));
  if(!options[index])return;
  const id=root.dataset.s2Select;
  const val=options[index].getAttribute('data-s2-option')||'';
  const label=options[index].textContent;
  const valueEl=root.querySelector('.qd-select__value');
  if(valueEl)valueEl.textContent=label;
  root.setAttribute('data-qd-value',label);
  options.forEach((o,i)=>{o.setAttribute('aria-selected',String(i===index));o.classList.toggle('is-selected',i===index);});
  const native=document.getElementById(id);
  if(native)native.value=val;
  if(id==='category')state.category=val;
  else if(id==='group')state.group=val;
  else if(id==='priceBand')state.priceBand=val;
  s2CloseSelect(root);
  renderProduct();
  const again=document.querySelector(`#productMount .qd-select--interactive[data-s2-select="${id}"]`);
  again?.focus();
}
function bindS2QdSelects(){
  if(window.__s2QdSelectBound)return;
  window.__s2QdSelectBound=true;
  document.addEventListener('click',e=>{
    const mount=document.getElementById('productMount');
    if(!mount)return;
    const root=e.target.closest('#productMount .qd-select--interactive');
    if(!root){s2CloseAllSelects();return;}
    const opt=e.target.closest('[data-s2-option]');
    if(opt&&root.contains(opt)){
      e.preventDefault();
      const options=Array.from(root.querySelectorAll('[role="option"]'));
      s2ChooseSelect(root,options.indexOf(opt));
      return;
    }
    const wasOpen=root.classList.contains('is-open');
    if(wasOpen)s2CloseSelect(root); else s2OpenSelect(root);
    root.focus();
  });
  document.addEventListener('keydown',e=>{
    const root=e.target.closest?.('#productMount .qd-select--interactive');
    if(!root){if(e.key==='Escape')s2CloseAllSelects();return;}
    const options=Array.from(root.querySelectorAll('[role="option"]'));
    const open=root.classList.contains('is-open');
    if(typeof root._s2Active!=='number')root._s2Active=Math.max(0,options.findIndex(o=>o.getAttribute('aria-selected')==='true'));
    if(e.key==='Escape'){if(open){e.preventDefault();s2CloseSelect(root);}return;}
    if(e.key==='Tab'){s2CloseSelect(root);return;}
    if(['ArrowDown','ArrowUp','Home','End'].includes(e.key)){
      e.preventDefault();
      if(!open){s2OpenSelect(root);if(e.key==='Home')root._s2Active=0;if(e.key==='End')root._s2Active=options.length-1;}
      else if(e.key==='ArrowDown')root._s2Active=(root._s2Active+1)%options.length;
      else if(e.key==='ArrowUp')root._s2Active=(root._s2Active+options.length-1)%options.length;
      else root._s2Active=e.key==='Home'?0:options.length-1;
      options.forEach((o,i)=>o.classList.toggle('is-highlighted',i===root._s2Active));
      if(options[root._s2Active])root.setAttribute('aria-activedescendant',options[root._s2Active].id);
      return;
    }
    if(e.key==='Enter'||e.key===' '){e.preventDefault();open?s2ChooseSelect(root,root._s2Active):s2OpenSelect(root);}
  });
}

</section>`;
}
document.addEventListener('click',e=>{const row=e.target.closest('[data-focus]');if(row&&!e.target.closest('input,[data-select],.fav,button')){state.focusId=row.dataset.focus;renderProduct();document.querySelector(`[data-focus="${state.focusId}"]`)?.focus();return;}let b=e.target.closest('button');if(!b)return;
if(b.dataset.step!==undefined)return setStep(+b.dataset.step);
if(b.dataset.task!==undefined){state.task=+b.dataset.task;return render();}
if(b.dataset.candidate){state.candidate=b.dataset.candidate;render();document.querySelector(`[data-candidate="${state.candidate}"]`).focus();return;}
if(b.dataset.hifi){state.hifiView=b.dataset.hifi;render();return;}
if(b.id==='choose'){state.chosen='B';return setStep(2,true);}
if(b.id==='revise')return setStep(1,true);
if(b.dataset.fav){state.favorites.has(b.dataset.fav)?state.favorites.delete(b.dataset.fav):state.favorites.add(b.dataset.fav);renderProduct();document.querySelector(`[data-fav="${b.dataset.fav}"]`)?.focus();return;}
if(b.dataset.focus){state.focusId=b.dataset.focus;renderProduct();document.querySelector(`[data-focus="${state.focusId}"]`)?.focus();return;}
if(b.id==='onlyFav'){state.onlyFav=!state.onlyFav;return renderProduct();}
if(b.id==='clearSelection'){state.selected.clear();return renderProduct();}
if(b.id==='selectVisible'){visible().forEach(p=>state.selected.add(p.id));return renderProduct();}
if(b.dataset.safe){state.notice=`${b.dataset.safe}：仅演示操作前核对，不执行、不提交、不改变商品数据。`;return renderProduct();}
});
document.addEventListener('input',e=>{if(e.target.id==='reason')state.reason=e.target.value;if(e.target.id==='search'){const pos=e.target.selectionStart;state.query=e.target.value;renderProduct();$('#search').focus();$('#search').setSelectionRange(pos,pos);}});
document.addEventListener('change',e=>{let t=e.target;/* category/group/priceBand via qd-select */if(t.dataset.compareSelect){state.comparePreviewId=t.checked?t.dataset.compareSelect:null;renderProduct();document.querySelector(`[data-compare-select="${t.dataset.compareSelect}"]`)?.focus();return;} if(t.dataset.select){t.checked?state.selected.add(t.dataset.select):state.selected.delete(t.dataset.select);renderProduct();document.querySelector(`[data-select="${t.dataset.select}"]`)?.focus();}if(t.id==='selectAll'){visible().forEach(p=>t.checked?state.selected.add(p.id):state.selected.delete(p.id));renderProduct();}});
document.addEventListener('keydown',e=>{if(e.target.matches('[data-step]')&&['ArrowRight','ArrowLeft','ArrowUp','ArrowDown','Home','End'].includes(e.key)){e.preventDefault();let n=e.key==='Home'?0:e.key==='End'?2:(state.step+(['ArrowRight','ArrowDown'].includes(e.key)?1:2))%3;setStep(n);$('#step'+n).focus();}if(e.target.matches('[data-candidate]')&&['ArrowRight','ArrowLeft','Home','End'].includes(e.key)){e.preventDefault();const keys=['A','B','C'];state.candidate=keys[e.key==='Home'?0:e.key==='End'?2:(keys.indexOf(state.candidate)+(e.key==='ArrowRight'?1:2))%3];render();document.querySelector(`[data-candidate="${state.candidate}"]`).focus();}if(e.target.matches('[data-focus]')&&['ArrowUp','ArrowDown','Home','End'].includes(e.key)){e.preventDefault();const ids=visible().map(p=>p.id);if(!ids.length)return;let i=Math.max(0,ids.indexOf(state.focusId));i=e.key==='Home'?0:e.key==='End'?ids.length-1:Math.max(0,Math.min(ids.length-1,i+(e.key==='ArrowDown'?1:-1)));state.focusId=ids[i];renderProduct();document.querySelector(`[data-focus="${state.focusId}"]`)?.focus();}});
bindS2QdSelects();
render();


function bc2Post(){var sc=document.querySelector('.showcase');if(sc)parent.postMessage({type:'bc2-height',h:Math.ceil(sc.getBoundingClientRect().bottom)},'*');}
window.addEventListener('load',bc2Post);
new ResizeObserver(bc2Post).observe(document.body);
bc2Post();
</script>
</body>
