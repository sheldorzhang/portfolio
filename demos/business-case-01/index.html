  }\n  .ds-overview-family {\n    padding: 16px 18px; border-radius: var(--qd-radius-large, 8px);\n    border: 1px solid var(--border); background: var(--bg-secondary);\n    cursor: pointer; text-align: left; font-family: inherit; transition: border-color 0.15s;\n  }\n  .ds-overview-family:hover { border-color: var(--accent); }\n  .ds-overview-family__title { font-size: 13px; font-weight: 600; color: var(--text-primary); margin-bottom: 6px; }\n  .ds-overview-family__count { font-size: 24px; font-weight: 600; color: var(--accent); margin-bottom: 8px; }\n  .ds-overview-family__items { font-size: 12px; line-height: 1.55; color: var(--text-tertiary); }\n\n  /* Preview 组件引言（与 figma-component-descriptions.md / preview-comp-descriptions.js 同步） */\n  .tmc-comp-intro { font-size: 14px; line-height: 1.65; color: var(--text-secondary); }\n  .tmc-comp-intro__block { margin-bottom: 14px; }\n  .tmc-comp-intro__label {\n    font-size: 11px; font-weight: 600; letter-spacing: 0.04em;\n    text-transform: uppercase; color: var(--text-tertiary); margin-bottom: 6px;\n  }\n  .tmc-comp-intro__zh { margin: 0 0 4px; color: var(--text-primary); }\n  .tmc-comp-intro__en { margin: 0; font-size: 13px; color: var(--text-tertiary); }\n  .tmc-comp-intro__details {\n    margin: 0 0 12px; padding: 10px 12px; border-radius: var(--qd-radius-base, 4px);\n    border: 1px solid var(--border); background: var(--bg-code, rgba(0,0,0,.03));\n  }\n  .tmc-comp-intro__details summary {\n    cursor: pointer; font-size: 12px; font-weight: 600; color: var(--text-secondary);\n    list-style: none;\n  }\n  .tmc-comp-intro__details summary::-webkit-details-marker { display: none; }\n  .tmc-comp-intro__details[open] summary { margin-bottom: 8px; }\n  .tmc-comp-intro__details .tmc-comp-intro__zh,\n  .tmc-comp-intro__details .tmc-comp-intro__en { font-size: 13px; }\n  .tmc-comp-intro__meta { margin: 0; font-size: 13px; padding-top: 10px; border-top: 1px solid var(--border); }\n  .tmc-comp-anchor { display: block; height: 0; margin: 0; padding: 0; border: 0; visibility: hidden; scroll-margin-top: 80px; }\n\n  /* ========== Section ========== */\n  .ds-section { margin-bottom: 48px; scroll-margin-top: 80px; }\n  .ds-section-title {\n    font-size: 20px; font-weight: 600; letter-spacing: -0.3px; margin-bottom: 6px;\n    display: flex; align-items: center; gap: 8px;\n  }\n  .ds-section-title .anchor {\n    font-size: 16px; color: var(--text-tertiary); opacity: 0; transition: opacity 0.2s; text-decoration: none;\n  }\n  .ds-section-title:hover .anchor { opacity: 1; }\n  .ds-section-desc { font-size: 14px; color: var(--text-secondary); margin-bottom: 20px; }\n  .ds-section-desc.tmc-lite-spec > p { margin: 0 0 6px; line-height: 1.75; color: var(--text-secondary); }\n  .ds-section-desc.tmc-lite-spec > p strong { color: var(--text-primary); }\n  .tmc-lite-spec-list {\n    margin: 10px 0 0; padding-left: 1.2rem; line-height: 1.72; color: var(--text-secondary);\n    list-style-type: disc;\n  }\n  .tmc-lite-spec-list li { margin-bottom: 12px; }\n  .tmc-lite-spec-list li:last-child { margin-bottom: 0; }\n  .tmc-lite-spec-list strong { color: var(--text-primary); font-weight: 600; }\n  .tmc-inline-code {\n    font-family: \"SF Mono\",\"Fira Code\",monospace; font-size: 12px; background: var(--bg-code);\n    padding: 2px 6px; border-radius: 4px; color: var(--accent);\n  }\n\n  /* ========== Color Scale Row (HeroUI Style) ========== */\n  .color-scale {\n    display: flex; border-radius: 12px; overflow: hidden; box-shadow: var(--shadow-sm);\n    border: 1px solid var(--swatch-border); margin-bottom: 8px;\n  }\n  .color-scale-item {\n    flex: 1; height: 52px; position: relative; cursor: pointer; transition: all 0.2s;\n    display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px;\n  }\n  .color-scale-item:hover { flex: 2.5; }\n  .color-scale-item .cs-label {\n    font-size: 0; opacity: 0; font-weight: 600; transition: all 0.2s; white-space: nowrap;\n  }\n  .color-scale-item:hover .cs-label { font-size: 10px; opacity: 1; }\n  .color-scale-item .cs-tooltip {\n    position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%);\n    background: var(--text-primary); color: var(--bg); padding: 6px 12px; border-radius: var(--qd-radius-large);\n    font-size: 11px; font-family: \"SF Mono\",\"Fira Code\",monospace; white-space: nowrap;\n    opacity: 0; pointer-events: none; transition: all 0.15s; z-index: 10;\n    box-shadow: var(--shadow-md);\n  }\n  .color-scale-item .cs-tooltip::after {\n    content: ''; position: absolute; top: 100%; left: 50%; transform: translateX(-50%);\n    border: 5px solid transparent; border-top-color: var(--text-primary);\n  }\n  .color-scale-item:hover .cs-tooltip { opacity: 1; bottom: calc(100% + 12px); }\n  .color-scale-name {\n    font-size: 14px; font-weight: 600; margin-bottom: 10px; display: flex; align-items: center; gap: 8px;\n  }\n  .color-scale-name .dot { width: 12px; height: 12px; border-radius: 4px; border: 1px solid var(--swatch-border); }\n\n  /* Semantic Tokens：状态色浅→深色带，主色加宽描边 */\n  .semantic-ramp { margin: 0 0 14px; }\n  .semantic-ramp .color-scale-item.is-main {\n    outline: 2px solid var(--accent, #5555ec);\n    outline-offset: 2px;\n    z-index: 1;\n    flex: 1.45;\n  }\n  .semantic-ramp .color-scale-item .cs-label {\n    font-size: 10px;\n    opacity: 0.9;\n    font-weight: 600;\n  }\n\n  /* ========== Light/Dark 模式切换 + 语义命名空间切换 tab (Base Colors / Semantic Tokens) ========== */\n  .ds-color-mode-tabs {\n    display: flex; align-items: center; flex-wrap: wrap; gap: 8px;\n    padding: 12px 14px; margin-bottom: 18px; border-radius: 12px;\n    background: var(--bg-secondary); border: 1px solid var(--swatch-border);\n    box-shadow: var(--shadow-sm);\n  }\n  .ds-cmt-btn {\n    display: inline-flex; align-items: center; gap: 4px;\n    padding: 6px 14px; font-size: 13px; font-weight: 500;\n    background: transparent; color: var(--text-secondary);\n    border: 1px solid var( t); }\n\n  /* ========== Typography Card ========== */\n  .typo-list { display: flex; flex-direction: column; gap: 2px; }\n  .typo-row {\n    display: flex; align-items: center; gap: 20px; padding: 16px 20px; border-radius: 12px;\n    cursor: pointer; transition: all 0.15s; border: 1px solid transparent;\n  }\n  .typo-row:hover { background: var(--bg-secondary); border-color: var(--border); }\n  .typo-row .tr-sample { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-primary); }\n  .typo-row .tr-meta {\n    display: flex; gap: 16px; flex-shrink: 0; align-items: center;\n  }\n  .typo-row .tr-tag {\n    font-size: 10px; padding: 2px 8px; border-radius: 6px; font-weight: 600;\n  }\n  .tr-tag.bold { background: var(--text-primary); color: var(--bg); }\n  .tr-tag.regular { background: var(--bg-tertiary); color: var(--text-secondary); }\n  .tr-tag.number { background: var(--qd-color-purple-1); color: var(--qd-color-purple-6); }\n  [data-theme=\"dark\"] .tr-tag.number { background: rgba(106,75,255,0.15); }\n  .typo-row .tr-prop { font-size: 11px; color: var(--text-tertiary); font-family: \"SF Mono\",\"Fira Code\",monospace; min-width: 48px; text-align: right; }\n  .typo-row .tr-class {\n    font-size: 10px; font-family: \"SF Mono\",\"Fira Code\",monospace; color: var(--accent);\n    background: var(--accent-light); padding: 3px 8px; border-radius: 6px; flex-shrink: 0;\n    opacity: 0; transition: opacity 0.15s;\n  }\n  .typo-row:hover .tr-class { opacity: 1; }\n\n  .typo-group-label {\n    font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px;\n    color: var(--text-tertiary); margin: 28px 0 8px; padding-left: 20px;\n  }\n  .typo-group-label:first-child { margin-top: 0; }\n\n  /* ========== Spacing Row ========== */\n  .spacing-list { display: flex; flex-direction: column; gap: 6px; }\n  .spacing-row {\n    display: flex; align-items: center; gap: 16px; padding: 10px 16px; border-radius: 1 or-primary 500｜底 --qd-color-white｜双层 card-shadow-light */\n  .qd-top-nav-item {\n    display: inline-flex;\n    align-items: center;\n    justify-content: center;\n    height: 34px;\n    padding: 6px var(--qd-spacing-base-loose); /* 6 12 — 6 无 spacing token 对应，组件内字面值 */\n    border-radius: var(--qd-radius-base);\n    background: transparent;\n    color: var(--qd-text-color-primary);\n    font-size: 14px;\n    line-height: 22px;\n    font-weight: 400;\n    text-decoration: none;\n    cursor: pointer;\n    transition: background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;\n    white-space: nowrap;\n  }\n  .qd-top-nav-item:hover {\n    background: var(--qd-fill-color-light);\n    color: var(--qd-text-color-primary);\n  }\n  .qd-top-nav-item.is-active,\n  .qd-top-nav-item[aria-current=\"page\"] {\n    background: var(--qd-color-white);\n    color: var(--qd-text-color-primary);\n    font-weight: 500; /* = bold/--body1-bold */\n    box-shadow: var(--qd-effect-qd-card-shadow-light);\n  }\n  .qd-top-nav-item.is-disabled,\n  .qd-top-nav-item[disabled] {\n    color: var(--qd-text-color-disabled);\n    cursor: not-allowed;\n    pointer-events: none;\n  }\n  /* 右侧：信息区（功能 icon-button × N + 头像）\n     功能按钮 = .qd-button.qd-button--md.qd-button--text.qd-button--default.qd-button--icon-only\n     不再自定义 __util — 直接复用 DS 标准 icon-button（透明默认 / hover --qd-fill-color） */\n  .qd-app-header__info {\n    display: flex;\n    align-items: center;\n    gap: var(--qd-spacing-base); /* 8 */\n    flex-shrink: 0;\n  }\n  /* 头像｜24×24 圆形｜brand color */\n  .qd-app-header__profile {\n    box-sizing: border-box;\n    width: 24px;\n    height: 24px;\n    padding: 0;\n    margin: 0;\n    border: none;\n    border-radius: 50%;\n    background: var(--qd-color-primary);\n    color: var(--qd-color-white);\n    display: inline-flex;\n    align-items: center;\n    justify-content: center;\n    font-family: inherit;\n    font-size: 12px;\n    line-height: 1;\n    font-weight: 500;\n    cursor: pointer;\n    flex-shrink: 0;\n    overflow: hidden;\n    appearance: none;\n    -webkit-appearance: none;\n    box-shadow: none;\n    vertical-align: middle;\n  }\n  .qd-app-header__profile:focus {\n    outline: none;\n  }\n  .qd-app-header__profile:focus-visible {\n    outline: 2px solid var(--qd-color-primary);\n    outline-offset: 2px;\n  }\n  .qd-app-header__profile img {\n    width: 100%;\n    height: 100%;\n    object-fit: cover;\n    display: block;\n    border: none;\n  }\n\n  /* ========== SideNavigation 侧边导航 (qd-app-sidebar｜Figma 24702:421) ==========\n     L0 应用壳层｜208w 固定｜白底 + 1px lighter 右边线｜padding 8/8/0/8\n     SideNavItem 组件集 24774:12｜level × state = L1/L2 × normal/hover/active\n      ｜normal: 透明\n      ｜hover : --qd-color-grey-2 (= --qd-fill-color｜#ECEFF3)\n      ｜active: --qd-fill-color-extra-light (#F7F8FA)\n     扩展能力（Figma 未直接建模，仓库实现）：\n      ｜L1 expandable → 展开/收起 L2 子列表（max-height transition 250ms）\n      ｜整体可收起为 icon-only 模式（.qd-app-sidebar.is-collapsed｜208 → 56｜width transition 250ms）\n     待 token 化（已记入 component-gap-log.md）：\n      ｜208w / 56w（壳层展开/收起宽，无 layout-tokens 变量）\n      ｜L1 顶下 9px padding（无 9 spacing token，组件内字面值）\n      ｜L2 左 44px padding（icon 列右沿对齐复合值） */\n  .qd-app-sidebar {\n    position: relative;\n    box-sizing: border-box;\n    width: 208px; /* L0 壳层｜待 token */\n    flex-shrink: 0;\n    padding: var(--qd-spacing-base) var(--qd-spacing-base) 0 var(--qd-spacing-base); /* 8 8 0 8 */\n    background: var(--qd-color-white);\n    border-right: 1px solid var(--qd-border-color-lighter);\n    display: flex;\n    flex-direction: column;\n    transition: width 0.25s cubic-bezier(0.4, 0, 0.2, 1);\n    overflow: hidden; /* 收起态裁切溢出，避免动画期间标签露头 */\n  }\n  /* 整体收起：icon-only｜仅显示 L1 头部 icon */\n  .qd-app-sidebar.is-collapsed {\n    width: 56px;\n  }\n  /* 滚动区｜组间 4px gap（--spacing-tight） */\n  .qd-app-sidebar__scroll {\n    flex: 1;\n    min-height: 0;\n    overflow-y: auto;\n    overflow-x: hidden;\n    display: flex;\n    flex-direction: column;\n    gap: var(--qd-spacing-tight);\n  }\n  /* 底部 footer｜含收起/展开 toggle｜无分割线（按设计稿 24702:421） */\n  .qd-app-sidebar__footer {\n    flex-shrink: 0;\n    padding: var(--qd-spacing-base) 0;\n    display: flex;\n    justify-content: flex-start;\n  }\n  /* footer toggle 内的双 icon｜默认显示 fold（\"折叠\"语义）；is-collapsed 切换为 expand */\n  .qd-app-sidebar__footer .qd-sidebar-expand-icon { display: none; }\n  .qd-app-sidebar.is-collapsed .qd-app-sidebar__footer .qd-sidebar-fold-icon { display: none; }\n  .qd-app-sidebar.is-collapsed .qd-app-sidebar__footer .qd-sidebar-expand-icon { display: inline-block; }\n  /* SideNavGroup｜L1 header + 可选 L2 列表（accordion） */\n  .qd-side-nav-group {\n    display: flex;\n    flex-direction: column;\n    gap: var(--qd-spacing-tight); /* 4 */\n  }\n  /* L2 列表容器｜max-height 过渡，承载展开/收起动效 */\n  .qd-side-nav-group__items {\n    display: flex;\n    flex-direction: column;\n    gap: var(--qd-spacing-tight);\n    max-height: 600px; /* 展开态上限，可覆盖 */\n    overflow: hidden;\n    transition: max-height 0.25s cubic-bezier(0.4, 0, 0.2, 1);\n  }\n  .qd-side-nav-group.is-collapsed .qd-side-nav-group__items {\n    max-height: 0;\n  }\n  /* ===== SideNavItem｜公共 (192×40｜r:base) ===== */\n  .qd-side-nav-item {\n    box-sizing: border-box;\n    width: 192px;\n    height: 40px;\n    display: flex;\n    align-items: center;\n    border-radius: var(--qd-radius-base); /* 4 */\n    background: transparent;\n    color: var(--qd-text-color-regular);\n    font-size: 14px;\n    line-height: 22px;\n    text-decoration: none;\n    cursor: pointer;\n    transition: background 0.15s ease, color 0.15s ease;\n    user-select: none;\n    font-family: inherit;\n    border: none;\n    text-align: left;\n  }\n  /* hover｜三态之一（Figma 24774:22 / 24774:53） */\n  .qd-side-nav-item:not(.is-disabled):not([disabled]):hover {\n    background: var(--qd-color-grey-2); /* = --qd-fill-color｜#ECEFF3 */\n    color: var(--qd-text-color-primary);\n  }\n  /* active｜三态之一（Figma 24774:40 / 24774:61） */\n  .qd-side-nav-item.is-active,\n  .qd-side-nav-item[aria-current=\"page\"] {\n    background: var(--qd-fill-color-extra-light); /* = grey-1｜#F7F8FA */\n    color: var(--qd-text-color-primary);\n    font-weight: 500;\n  }\n  /* L1｜顶级菜单｜padding 9/16/9/16（顶下 9 无 spacing token，字面值） */\n  .qd-side-nav-item--l1 {\n    padding: 9px var(--qd-spacing-loose); /* 9 16 9 16 */\n    justify-content: space-between;\n    gap: var(--qd-spacing-base); /* 8 */\n  }\n  /* L2｜子菜单｜padding 8/16/8/44｜44 左缩进对齐 L1 icon 列右沿 */\n  .qd-side-nav-item--l2 {\n    padding: var(--qd-spacing-base) var(--qd-spacing-loose) var(--qd-spacing-base) 44px; /* 8 16 8 44 — 44 缺 token */\n    color: var(--qd-text-color-regular);\n  }\n  .qd-side-nav-item.is-disabled,\n  .qd-side-nav-item[disabled] {\n    color: var(--qd-text-color-disabled);\n    cursor: not-allowed;\n    pointer-events: none;\n    background: transparent;\n  }\n  /* L1 左侧 [icon + label] 复合块（菜单名称 frame｜gap 8） */\n  .qd-side-nav-item__main {\n    display: flex;\n    align-items: center;\n    gap: var(--qd-spacing-base); /* 8 */\n    flex: 1;\n    min-width: 0;\n  }\n  .qd-side-nav-item__icon {\n    width: 16px;\n    height: 16px;\n    flex-shrink: 0;\n    color: var(--qd-text-color-regular);\n    display: inline-flex;\n    align-items: center;\n    justify-content: center;\n  }\n  .qd-side-nav-item__icon svg {\n    width: 100%;\n    height: 100%;\n  }\n  .qd-side-nav-item.is-active .qd-side-nav-item__icon,\n  .qd-side-nav-item[aria-current=\"page\"] .qd-side-nav-item__icon {\n    color: var(--qd-text-color-primary);\n  }\n  .qd-side-nav-item__label {\n    flex: 1;\n    min-width: 0;\n    overflow: hidden;\n    text-overflow: ellipsis;\n    white-space: nowrap;\n    transition: opacity 0.15s ease;\n  }\n  /* L1 右侧 expand arrow｜expanded(默认朝下) / collapsed(朝右) */\n  .qd-side-nav-item__arrow {\n    width: 16px;\n    height: 16px;\n    flex-shrink: 0;\n    color: var(--qd-text-color-placeholder);\n    display: inline-flex;\n    align-items: center;\n    justify-content: center;\n    transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);\n  }\n  .qd-side-nav-item__arrow svg {\n    width: 100%;\n    height: 100%;\n  }\n  /* 箭头约定：上=展开 / 下=收起\n     默认 icon ds-icon-arrow-down 指下 → 收起态保留原状；展开态旋转 180deg 指上 */\n  .qd-side-nav-group:not(.is-collapsed) .qd-side-nav-item__arrow {\n    transform: rotate(180deg);\n  }\n  /* ===== 整体收起态｜icon-only｜隐藏 label/arrow/L2，L1 居中显示 icon =====\n     关键修复：__main 默认 flex:1 把内部撑满 40w 导致 icon 留在左侧 → 收起时改 flex:0 0 auto + 内部居中 */\n  .qd-app-sidebar.is-collapsed .qd-side-nav-item {\n    width: 40px;\n    justify-content: center;\n  }\n  .qd-app-sidebar.is-collapsed .qd-side-nav-item--l1 {\n    padding: 0;\n    justify-content: center;\n  }\n  .qd-app-sidebar.is-collapsed .qd-side-nav-item__main {\n    flex: 0 0 auto;\n    justify-content: center;\n    gap: 0;\n  }\n  .qd-app-sidebar.is-collapsed .qd-side-nav-item__label,\n  .qd-app-sidebar.is-collapsed .qd-side-nav-item__arrow {\n    display: none;\n  }\n  .qd-app-sidebar.is-collapsed .qd-side-nav-item--l2 {\n    display: none;\n  }\n  .qd-app-sidebar.is-collapsed .qd-app-sidebar__footer {\n    justify-content: center;\n  }\n\n  /* ========== AppShell 应用壳层 (qd-app-shell｜Figma 24618:13460) ==========\n     L0 壳层骨架｜横向 H-stack：sidebar + main\n     完整规范见 .cursor/skills/tmc-ds2-page-paradigms/foundation-spec.md */\n  .qd-app-shell {\n    display: flex;\n    flex-direction: column;\n    min-width: 1280px; /* --pl-viewport-min-width */\n    min-height: 800px; /* --pl-viewport-min-height */\n    background: var(--qd-bg-color-canvas);\n  }\n  .qd-app-shell__body {\n    display: flex;\n    flex: 1;\n    min-height: 0;\n    background: var(--qd-color-white);\n    border-radius: var(--qd-radius-special); /* 12px｜左右圆角 */\n    overflow: hidden;\n  }\n  .qd-app-shell__main {\n    flex: 1;\n    min-width: 0;\n    display: flex;\n    flex-direction: column;\n    background: var(--qd-color-white);\n    overflow: auto;\n  }\n\n  /* ========== DS Icons gallery (Components) == alog__title\">选择素材<\/h2><button aria-label=\"关闭\" class=\"qd-dialog__headerbtn\" type=\"button\"><svg fill=\"currentColor\" viewbox=\"0 0 16 16\"><use href=\"#ds-icon-close\"><\/use><\/svg><\/button><\/div>\n<div class=\"qd-dialog__body\">\n<div class=\"pl-row\" style=\"margin-bottom:var(--qd-spacing-loose)\">\n<div style=\"width:140px\"><div class=\"qd-select qd-select--interactive qd-select\" data-qd-select=\"全部类型|图片|视频\" data-qd-value=\"全部类型\"><span class=\"qd-select__value\">全部类型<\/span><\/div><\/div>\n<div style=\"width:140px\"><div class=\"qd-select qd-select--interactive qd-select\" data-qd-select=\"全部语言|EN|zh-hans|zh-hant\" data-qd-value=\"全部语言\"><span class=\"qd-select__value\">全部语言<\/span><\/div><\/div>\n<div class=\"qd-input qd-input--md\" style=\"flex:1\"><input class=\"qd-input__inner\" placeholder=\"搜索素材名称\"/><\/div>\n<\/div>\n<div class=\"pl-cards\">\n<article class=\"pl-card\"><div class=\"pl-card__img\">🖼<\/div><div class=\"pl-card__info\"><div class=\"pl-card__name\">KFC App Banner EN<\/div><div class=\"pl-muted\">#2001｜图片｜EN<\/div><\/div><\/article>\n<article class=\"pl-card\"><div class=\"pl-card__img\">🖼<\/div><div class=\"pl-card__info\"><div class=\"pl-card__name\">KFC Web Banner 繁中<\/div><div class=\"pl-muted\">#2003｜图片｜zh-hant<\/div><\/div><\/article>\n<article class=\"pl-card\"><div class=\"pl-card__img\">🖼<\/div><div class=\"pl-card__info\"><div class=\"pl-card__name\">奖励图片 简中<\/div><div class=\"pl-muted\">#2005｜图片｜zh-hans<\/div><\/div><\/article>\n<article class=\"pl-card\"><div class=\"pl-card__img\">📹<\/div><div class=\"pl-card__info\"><div class=\"pl-card__name\">产品介绍视频<\/div><div class=\"pl-muted\">#2007｜视频｜EN<\/div><\/div><\/article>\n<article class=\"pl-card\"><div class=\"pl-card__img\">⭐<\/div><div class=\"pl-card__info\"><div class=\"pl-card__name\">贴纸素材<\/div><div class=\"pl-muted\">#2009｜图片｜通用<\/div><\/div><\/article>\n<article class=\"pl-card\"><div class=\"pl-card__img\">📄<\/div><div class=\"pl-card__info\"><div class=\"pl-card__name\">E-Stamp图片<\/div><div class=\"pl-muted\">#2011｜图片｜zh-hant<\/div><\/div><\/article>\n<\/div>\n<\/div>\n<div class=\"qd-dialog__footer\"><button class=\"qd-button qd-button--md qd-button--default\" type=\"button\"><span>取消<\/span><\/button><button class=\"qd-button qd-button--md qd-button--primary\" type=\"button\"><span>确认选择<\/span><\/button><\/div>\n<\/div>\n<\/div>\n<div class=\"qd-overlay qd-overlay--dialog\" id=\"field-modal\">\n<div aria-modal=\"true\" class=\"qd-dialog\" role=\"dialog\">\n<div class=\"qd-dialog__header\"><h2 class=\"qd-dialog__title\">新建自定义字段<\/h2><button aria-label=\"关闭\" class=\"qd-dialog__headerbtn\" type=\"button\"><svg fill=\"currentColor\" viewbox=\"0 0 16 16\"><use href=\"#ds-icon-close\"><\/use><\/svg><\/button><\/div>\n<div class=\"qd-dialog__body\">\n<div class=\"form-row\"><div class=\"form-row__label\"><span class=\"req\">*<\/span>字段名称<\/div><div class=\"form-row__field\"><div class=\"qd-input qd-input--md\"><input class=\"qd-input__inner\" placeholder=\"如：Offer类型\"/><\/div><\/div><\/div>\n<div class=\"form-row\"><div class=\"form-row__label\"><span class=\"req\">*<\/span>字段标识<\/div><div class=\"form-row__field\"><div class=\"qd-input qd-input--md\"><input class=\"qd-input__inner\" placeholder=\"英文标识，如 offer_type\"/><\/div><\/div><\/div>\n<div class=\"pl-form-grid\">\n<div class=\"form-row\"><div class=\"form-row__label\"><span class=\"req\">*<\/span>字段分类<\/div><div class=\"form-row__field\"><div class=\"qd-select qd-select--interactive qd-select\" data-qd-select=\"商品核心扩展|价格与积分|促销规则|渠道展示配置|其他\" data-qd-value=\"商品核心扩展\"><span class=\"qd-select__value\">商品核心扩展<\/span><\/div><\/div><\/div>\n<div class=\"form-row\"><div class=\"form-row__label\"><span class=\"req\">*<\/span>字段类型<\/div><div class=\"form-row__field\"><div class=\"qd-select qd-select--interactive qd-select\" data-qd-select=\"文本|数字|单选枚举|多选枚举|布尔开关|日期|日期范围|URL|JSON\" data-qd-value=\"文本\"><span class=\"qd-select__value\">文本<\/span><\/div><\/div><\/div>\n<\/div>\n<div class=\"form-row\"><div class=\"form-row__label\">枚举选项<\/div><div class=\"form-row__field\"><div class=\"pl-row\" style=\"margin-bottom:var(--qd-spacing-base)\"><span class=\"qd-tag qd-tag--info\">选项1<\/span><span class=\"qd-tag qd-tag--info\">选项2<\/span><\/div><div class=\"pl-row\"><div class=\"qd-input qd-input--md\" style=\"flex:1\"><input class=\"qd-input__inner\" placeholder=\"输入选项值\"/><\/div><button class=\"qd-button qd-button--sm qd-button--primary\" type=\"button\"><span>添加<\/span><\/button><\/div><\/div><\/div>\n<div class=\"form-row\"><div class=\"form-row__label\"><span class=\"req\">*<\/span>是否必填<\/div><div class=\"form-row__field\"><label class=\"qd-switch\"><span class=\"qd-switch__core\"><span class=\"qd-switch__action\"><\/span><\/span><\/label><\/div><\/div>\n<div class=\"form-row\"><div class=\"form-row__label\">字段说明<\/div><div class=\"form-row__field\"><div class=\"qd-textarea\"><textarea class=\"qd-textarea__inner\" placeholder=\"录入提示说明，最多200字符\" rows=\"2\"><\/textarea><\/div><\/div><\/div>\n<div class=\"form-row\"><div class=\"form-row__label\">排序权重<\/div><div class=\"form-row__field\"><div class=\"qd-input qd-input--md\"><input class=\"qd-input__inner\" placeholder=\"数字越小越靠前\" type=\"number\"/><\/div><\/div><\/div>\n<\/div>\n<div class=\"qd-dialog__footer\"><button class=\"qd-button qd-button--md qd-button--default\" type=\"button\"><span>取消<\/span><\/button><button class=\"qd-button qd-button--md qd-button--primary\" type=\"button\"><span>确定<\/span><\/button><\/div>\n<\/div>\n<\/div>\n<div id=\"toast-container\"><\/div>\n<script id=\"showcase-product-group-only\">(()=>{\n  const root=document.getElementById('showcase-product-group');\n  if(!root)return;\n  const label=root.querySelector('.qd-select__value');\n  const list=root.querySelector('[role=\"listbox\"]');\n  const options=Array.from(root.querySelectorAll('[role=\"option\"]'));\n  let selected=options.findIndex(item=>item.getAttribute('aria-selected')==='true');\n  if(selected<0)selected=0;\n  let active=selected;\n  let open=false;\n  function highlight(){\n    options.forEach((item,index)=>item.classList.toggle('is-highlighted',index===active));\n    root.setAttribute('aria-activedescendant',options[active].id);\n  }\n  function close(){\n    open=false;\n    root.classList.remove('is-open');\n    root.setAttribute('aria-expanded','false');\n    root.removeAttribute('aria-activedescendant');\n    list.hidden=true;\n  }\n  function expand(){\n    open=true;\n    active=selected;\n    list.hidden=false;\n    root.classList.add('is-open');\n    root.setAttribute('aria-expanded','true');\n    highlight();\n  }\n  function choose(index){\n    selected=index;\n    label.textContent=options[index].textContent;\n    root.setAttribute('data-qd-value',options[index].textContent);\n    options.forEach((item,i)=>{\n      item.setAttribute('aria-selected',String(i===selected));\n      item.classList.toggle('is-selected',i===selected);\n    });\n    close();\n    root.focus();\n  }\n  root.addEventListener('click',event=>{\n    const option=event.target.closest('[data-group-option]');\n    if(option&&root.contains(option)){\n      event.preventDefault();\n      choose(options.indexOf(option));\n      return;\n    }\n    open?close():expand();\n    root.focus();\n  });\n  root.addEventListener('keydown',event=>{\n    if(event.key==='Escape'){if(open){event.preventDefault();close();}return;}\n    if(event.key==='Tab'){close();return;}\n    if(['ArrowDown','ArrowUp','Home','End'].includes(event.key)){\n      event.preventDefault();\n      if(!open){expand();if(event.key==='Home')active=0;if(event.key==='End')active=options.length-1;}\n      else if(event.key==='ArrowDown')active=(active+1)%options.length;\n      else if(event.key==='ArrowUp')active=(active+options.length-1)%options.length;\n      else active=event.key==='Home'?0:options.length-1;\n      highlight();return;\n    }\n    if(event.key==='Enter'||event.key===' '){event.preventDefault();open?choose(active):expand();}\n  });\n  document.addEventListener('click',event=>{if(open&&!root.contains(event.target))close();});\n})();\n<\/script><script>\n(function () {\n  'use strict';\n  const scroller = document.querySelector('#page-product-list .page__content__scroll');\n  if (!scroller) return;\n  const states = ['is-scrolling-none', 'is-scrolling-left', 'is-scrolling-middle', 'is-scrolling-right'];\n  function updateFixedShadow() {\n    const overflow = scroller.scrollWidth - scroller.clientWidth;\n    let next = 'is-scrolling-none';\n    if (overflow > 0) {\n      if (scroller.scrollLeft <= 0) next = 'is-scrolling-left';\n      else if (scroller.scrollLeft >= overflow - 1) next = 'is-scrolling-right';\n      else next = 'is-scrolling-middle';\n    }\n    states.forEach(state => scroller.classList.toggle(state, state === next));\n  }\n  scroller.addEventListener('scroll', updateFixedShadow, { passive: true });\n  window.addEventListener('resize', updateFixedShadow);\n  window.addEventListener('load', updateFixedShadow);\n  if (typeof ResizeObserver !== 'undefined') {\n    const observer = new ResizeObserver(updateFixedShadow);\n    observer.observe(scroller);\n    const table = scroller.querySelector('table');\n    if (table) observer.observe(table);\n  }\n  updateFixedShadow();\n})();\n<\/script><script>\n(function () {\n  'use strict';\n  const page = document.querySelector('#page-product-list');\n  if (!page) return;\n  const body = page.querySelector('#product-table-body');\n  const totalEl = page.querySelector('#showcase-product-pagination-total');\n  const pager = page.querySelector('#showcase-product-pagination-pager');\n  const jump = page.querySelector('#showcase-product-pagination-jump');\n  const sizeRoot = page.querySelector('#showcase-page-size');\n  if (!body || !totalEl || !pager || !sizeRoot) return;\n  const rows = Array.from(body.children).filter(el => el.tagName === 'TR');\n  const total = rows.length;\n  const sizeOptions = Array.from(sizeRoot.querySelectorAll('[data-page-size]'));\n  const sizeLabel = sizeRoot.querySelector('.qd-select__value');\n  let pageSize = 10;\n  let current = 1;\n  let open = false;\n  let active = 0;\n\n  function pageCount() {\n    return Math.max(1, Math.ceil(total / pageSize));\n  }\n  function clamp() {\n    current = Math.min(Math.max(1, current), pageCount());\n  }\n  function renderRows() {\n    const start = (current - 1) * pageSize;\n    const end = start + pageSize;\n    rows.forEach((row, index) => {\n      row.hidden = !(index >= start && index < end);\n    });\n  }\n  function renderPager() {\n    const pages = pageCount();\n    const prevDisabled = current <= 1;\n    const nextDisabled = current >= pages;\n    let html = '';\n    html += '<li class=\"qd-pagination__btn' + (prevDisabled ? ' is-disabled' : '') + '\" data-page-btn=\"prev\" aria-label=\"上一页\" ' + (prevDisabled ? 'aria-disabled=\"true\"' : '') + '>‹<\/li>';\n    for (let i = 1; i <= pages; i++) {\n      html += '<li' + (i === current ? ' class=\"is-active\" aria-current=\"page\"' : '') + ' data-page=\"' + i + '\">' + i + '<\/li>';\n    }\n    html += '<li class=\"qd-pagination__btn' + (nextDisabled ? ' is-disabled' : '') + '\" data-page-btn=\"next\" aria-label=\"下一页\" ' + (nextDisabled ? 'aria-disabled=\"true\"' : '') + '>›<\/li>';\n    pager.innerHTML = html;\n    if (jump) jump.value = String(current);\n  }\n  function render() {\n    clamp();\n    totalEl.textContent = '共 ' + total + ' 条';\n    sizeLabel.textContent = pageSize + '条/页';\n    sizeRoot.setAttribute('data-qd-value', pageSize + '条/页');\n    sizeOptions.forEach((item, index) => {\n      const selected = Number(item.getAttribute('data-page-size')) === pageSize;\n      item.setAttribute('aria-selected', String(selected));\n      item.classList.toggle('is-selected', selected);\n      if (selected) active = index;\n    });\n    renderRows();\n    renderPager();\n  }\n  function closeSize() {\n    open = false;\n    sizeRoot.classList.remove('is-open');\n    sizeRoot.setAttribute('aria-expanded', 'false');\n    const list = sizeRoot.querySelector('.qd-select-dropdown');\n    if (list) list.hidden = true;\n  }\n  function openSize() {\n    open = true;\n    sizeRoot.classList.add('is-open');\n    sizeRoot.setAttribute('aria-expanded', 'true');\n    const list = sizeRoot.querySelector('.qd-select-dropdown');\n    if (list) list.hidden = false;\n  }\n  sizeRoot.addEventListener('click', event => {\n    const option = event.target.closest('[data-page-size]');\n    if (option && sizeRoot.contains(option)) {\n      event.preventDefault();\n      pageSize = Number(option.getAttribute('data-page-size'));\n      current = 1;\n      closeSize();\n      render();\n      sizeRoot.focus();\n      return;\n    }\n    if (open) closeSize(); else openSize();\n    sizeRoot.focus();\n  });\n  sizeRoot.addEventListener('keydown', event => {\n    if (event.key === 'Escape') { if (open) { event.preventDefault(); closeSize(); } return; }\n    if (event.key === 'Tab') { closeSize(); return; }\n    if (['ArrowDown', 'ArrowUp', 'Home', 'End'].includes(event.key)) {\n      event.preventDefault();\n      if (!open) openSize();\n      else if (event.key === 'ArrowDown') active = (active + 1) % sizeOptions.length;\n      else if (event.key === 'ArrowUp') active = (active + sizeOptions.length - 1) % sizeOptions.length;\n      else active = event.key === 'Home' ? 0 : sizeOptions.length - 1;\n      sizeOptions.forEach((item, index) => item.classList.toggle('is-highlighted', index === active));\n      return;\n    }\n    if (event.key === 'Enter' || event.key === ' ') {\n      event.preventDefault();\n      if (!open) { openSize(); return; }\n      pageSize = Number(sizeOptions[active].getAttribute('data-page-size'));\n      current = 1;\n      closeSize();\n      render();\n    }\n  });\n  document.addEventListener('click', event => {\n    if (open && !sizeRoot.contains(event.target)) closeSize();\n  });\n  pager.addEventListener('click', event => {\n    const btn = event.target.closest('[data-page-btn]');\n    const pageItem = event.target.closest('[data-page]');\n    if (btn) {\n      if (btn.classList.contains('is-disabled')) return;\n      current += btn.getAttribute('data-page-btn') === 'next' ? 1 : -1;\n      render();\n      return;\n    }\n    if (pageItem) {\n      current = Number(pageItem.getAttribute('data-page'));\n      render();\n    }\n  });\n  if (jump) {\n    jump.addEventListener('keydown', event => {\n      if (event.key !== 'Enter') return;\n      event.preventDefault();\n      const value = parseInt(jump.value, 10);\n      if (!Number.isFinite(value)) { jump.value = String(current); return; }\n      current = value;\n      render();\n    });\n    jump.addEventListener('change', () => {\n      const value = parseInt(jump.value, 10);\n      if (!Number.isFinite(value)) { jump.value = String(current); return; }\n      current = value;\n      render();\n    });\n  }\n  render();\n})();\n<\/script><\/body>\n<\/html>\n"};
const stages=[{"title": "想法输入", "railTitle": "任意方式作为输入起点", "kind": "input", "railItems": ["自然语言", "草图", "截图", "Figma 稿", "非标准原型", "野生 vibecoding", "非合规产物"]}, {"title": "AI 生成业务合规设计", "railTitle": "生成业务合规设计", "kind": "output", "railItems": ["高保真 HTML", "商品列表", "原有业务内容"]}];
let activeStage=0,kind="input",view="product-list";

function fit(){const scale=$('viewport').clientWidth/1440;$('preview').style.transform=`scale(${scale})`;$('viewport').style.height=Math.round(960*scale)+'px';}
function drawPreview(){$('preview').setAttribute('sandbox',kind==='output'?'allow-scripts':'');const css=`<style>body .page{display:none!important}body #page-${view}{display:flex!important;flex-direction:column!important;height:100%!important;min-height:0!important}</style>`;$('preview').srcdoc=PREVIEWS[kind].replace(/img-src data:/g,'img-src data: '+new URL('../../assets/be4d-business/',location.href).href).replace('<head>','<head><base href="'+location.href+'">').replace('</head>',css+'</head>');fit();}
function showStage(n){$('railMaterials').hidden=n!==0;$('railFlow').hidden=n!==1;activeStage=n;const s=stages[n];kind=s.kind;for(const [id,val] of Object.entries({railTitle:s.railTitle,railItem0:s.railItems[0],railItem1:s.railItems[1],railItem2:s.railItems[2],railItem3:s.railItems[3]||"",railItem4:s.railItems[4]||"",railItem5:s.railItems[5]||"",railItem6:s.railItems[6]||""}))$(id).textContent=val;document.querySelectorAll('[data-stage]').forEach(b=>{const on=Number(b.dataset.stage)===n;b.setAttribute('aria-selected',String(on));b.tabIndex=on?0:-1});$('stage-panel').setAttribute('aria-labelledby','tab'+n);drawPreview();}
document.querySelectorAll('[data-stage]').forEach(b=>{b.addEventListener('click',()=>showStage(Number(b.dataset.stage)));b.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const n=e.key==='Home'?0:e.key==='End'?1:(activeStage+1)%2;showStage(n);$('tab'+n).focus()}})});
window.addEventListener('resize',fit);showStage(0);

new ResizeObserver(bc1Post).observe(document.body);

fit();bc1Post();
